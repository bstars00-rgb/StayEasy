name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Cancel superseded runs on the same ref.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci

      # Unit tests
      - run: npm run test

      # Playwright browser + system deps
      - run: npx playwright install --with-deps chromium

      # Offline E2E (localStorage mode) — Playwright boots the dev server.
      - run: npm run e2e

      # API-mode E2E — Playwright boots backend (8787) + frontend (5174) together.
      - run: npm run e2e:api

      - name: Upload traces on failure
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore
