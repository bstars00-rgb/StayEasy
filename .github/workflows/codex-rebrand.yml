name: Codex Backend Rebrand

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/codex-rebrand.yml

permissions:
  contents: write

jobs:
  rebrand:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply OhmySelect backend rebrand
        run: |
          node <<'NODE'
          const fs = require('fs')

          const replaceAll = (file, replacements) => {
            let text = fs.readFileSync(file, 'utf8')
            for (const [from, to] of replacements) text = text.split(from).join(to)
            fs.writeFileSync(file, text)
          }

          const backendFiles = ['backend/db.js', 'backend/server.js']
          for (const file of backendFiles) {
            replaceAll(file, [
              ['StayEasyStore', 'OhmySelectStore'],
              ['StayEasy Demo User', 'OhmySelect Demo User'],
              ['@stayeasy.local', '@ohmyselect.local'],
              ['StayEasy backend listening', 'OhmySelect backend listening'],
              ['stayeasy-backend', 'ohmyselect-backend'],
            ])
          }

          const docFiles = [
            'docs/BACKEND_API_SPEC.md',
            'docs/BACKEND_PROTOTYPE.md',
            'docs/BACKEND_TASKS.md',
            'docs/COLLABORATION_PLAN.md',
            'docs/DATABASE_SCHEMA.md',
            'docs/QA_CHECKLIST.md',
            'docs/CLAUDE_FRONTEND_INTEGRATION_GUIDE.md',
          ]
          for (const file of docFiles) replaceAll(file, [['StayEasy', 'OhmySelect']])

          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'))
          pkg.name = 'ohmyselect'
          fs.writeFileSync('package.json', `${JSON.stringify(pkg, null, 2)}\n`)

          if (fs.existsSync('package-lock.json')) {
            const lock = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'))
            lock.name = 'ohmyselect'
            if (lock.packages && lock.packages['']) lock.packages[''].name = 'ohmyselect'
            fs.writeFileSync('package-lock.json', `${JSON.stringify(lock, null, 2)}\n`)
          }
          NODE
      - name: Sync package lock
        run: npm install --package-lock-only
      - name: Verify rebrand exceptions
        run: |
          ! grep -R "StayEasy\|stayeasy.local\|StayEasyStore" backend docs/BACKEND_API_SPEC.md docs/BACKEND_PROTOTYPE.md docs/BACKEND_TASKS.md docs/COLLABORATION_PLAN.md docs/DATABASE_SCHEMA.md docs/QA_CHECKLIST.md docs/CLAUDE_FRONTEND_INTEGRATION_GUIDE.md package.json package-lock.json
          grep -R "demo-google-user" backend src >/dev/null
          grep -R "stayeasy\." src docs/CLAUDE_FRONTEND_INTEGRATION_GUIDE.md >/dev/null
          grep -R "/StayEasy/" vite.config.js >/dev/null
      - name: Commit rebrand
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/db.js backend/server.js docs/BACKEND_API_SPEC.md docs/BACKEND_PROTOTYPE.md docs/BACKEND_TASKS.md docs/COLLABORATION_PLAN.md docs/DATABASE_SCHEMA.md docs/QA_CHECKLIST.md docs/CLAUDE_FRONTEND_INTEGRATION_GUIDE.md package.json package-lock.json
          if git diff --cached --quiet; then
            echo "No rebrand changes to commit."
          else
            git commit -m "Rebrand backend to OhmySelect"
            git push
          fi
