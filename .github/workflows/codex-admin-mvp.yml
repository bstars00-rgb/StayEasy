name: Codex Admin MVP

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/codex-admin-mvp.yml

permissions:
  contents: write

jobs:
  admin-mvp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply admin MVP changes from previous workflow
        shell: bash
        run: |
          git show HEAD~1:.github/workflows/codex-admin-mvp.yml > /tmp/previous-admin-workflow.yml
          awk "BEGIN{capture=0} /node <<'NODE'/{capture=1; next} /^          NODE$/{if(capture){exit}} capture{ sub(/^          /, \"\"); print }" /tmp/previous-admin-workflow.yml > /tmp/apply-admin-mvp.js
          node /tmp/apply-admin-mvp.js
      - name: Verify syntax
        shell: bash
        run: |
          npm install
          node --check backend/server.js
          node --check backend/db.js
          node --check e2e-api/api-flow.spec.js
      - name: Commit admin MVP
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/db.js backend/server.js e2e-api/api-flow.spec.js playwright.api.config.js
          if git diff --cached --quiet; then
            echo "No admin MVP changes to commit."
          else
            git commit -m "Add admin MVP backend APIs"
            git push
          fi
