name: Codex Admin MVP

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/codex-admin-mvp.yml

permissions:
  contents: write

jobs:
  admin-mvp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply admin MVP changes
        run: |
          node <<'NODE'
          const fs = require('fs')
          const replaceOnce = (file, from, to) => {
            let text = fs.readFileSync(file, 'utf8')
            if (!text.includes(to) && text.includes(from)) text = text.replace(from, to)
            fs.writeFileSync(file, text)
          }

          let db = fs.readFileSync('backend/db.js', 'utf8')
          const userFrom = "function userFrom(row) { return row && { id: row.id, provider: row.provider, name: row.name, email: row.email, picture: row.picture_url || '', createdAt: row.created_at, updatedAt: row.updated_at } }"
          const assistanceFrom = "function assistanceFrom(row) { return row && { id: row.id, userId: row.user_id || null, name: row.name || '', contact: row.contact || '', city: row.city_id || '', membershipId: row.membership_id || null, preferredDate: row.preferred_date || null, adults: Number(row.adults) || 0, children: Number(row.children) || 0, requestType: row.request_type || '', message: row.message || '', status: row.status, adminNote: row.admin_note || '', createdAt: row.created_at, updatedAt: row.updated_at || row.created_at } }"
          if (!db.includes('function assistanceFrom')) db = db.replace(`${userFrom}\n\nexport class OhmySelectStore`, `${userFrom}\n\n${assistanceFrom}\n\nexport class OhmySelectStore`)
          db = db.replace("CREATE TABLE IF NOT EXISTS assistance_requests (id TEXT PRIMARY KEY, user_id TEXT, name TEXT, contact TEXT, city_id TEXT, membership_id TEXT, preferred_date TEXT, adults INTEGER, children INTEGER, request_type TEXT, message TEXT, status TEXT NOT NULL, created_at TEXT NOT NULL);", "CREATE TABLE IF NOT EXISTS assistance_requests (id TEXT PRIMARY KEY, user_id TEXT, name TEXT, contact TEXT, city_id TEXT, membership_id TEXT, preferred_date TEXT, adults INTEGER, children INTEGER, request_type TEXT, message TEXT, status TEXT NOT NULL, admin_note TEXT DEFAULT '', created_at TEXT NOT NULL, updated_at TEXT);")
          if (!db.includes('ADD COLUMN admin_note')) db = db.replace('    `)\n  }\n  async seed()', '    `)\n    await this.db.run(\'ALTER TABLE assistance_requests ADD COLUMN admin_note TEXT DEFAULT ""\').catch(() => {})\n    await this.db.run(\'ALTER TABLE assistance_requests ADD COLUMN updated_at TEXT\').catch(() => {})\n  }\n  async seed()')
          const oldAssistance = "  async createAssistance(input,makeId,userId=null){const entry={id:makeId('ast'),...input,status:'new',createdAt:now()}; await this.db.run('INSERT INTO assistance_requests (id,user_id,name,contact,city_id,membership_id,preferred_date,adults,children,request_type,message,status,created_at) VALUES (?,?,?,?,?,?,?,?,?,?,?,?,?)',[entry.id,userId,input.name||'',input.contact||'',input.city||input.cityId||'',input.membershipId||null,input.preferredDate||null,input.adults||0,input.children||0,input.requestType||'',input.message||'',entry.status,entry.createdAt]); return entry}"
          const adminMethods = "  async createAssistance(input,makeId,userId=null){const entry={id:makeId('ast'),...input,status:'new',createdAt:now(),updatedAt:now()}; await this.db.run('INSERT INTO assistance_requests (id,user_id,name,contact,city_id,membership_id,preferred_date,adults,children,request_type,message,status,admin_note,created_at,updated_at) VALUES (?,?,?,?,?,?,?,?,?,?,?,?,?,?,?)',[entry.id,userId,input.name||'',input.contact||'',input.city||input.cityId||'',input.membershipId||null,input.preferredDate||null,input.adults||0,input.children||0,input.requestType||'',input.message||'',entry.status,'',entry.createdAt,entry.updatedAt]); return entry}\n  async adminOrders(){return (await this.db.all('SELECT * FROM orders ORDER BY created_at DESC')).map(orderFrom)}\n  async adminReservations(){return (await this.db.all('SELECT * FROM reservations ORDER BY created_at DESC')).map(reservationFrom)}\n  async adminAssistanceRequests(){return (await this.db.all('SELECT * FROM assistance_requests ORDER BY created_at DESC')).map(assistanceFrom)}\n  async adminUpdateOrderStatus(id,status){return this.db.tx(async tx=>{const o=await tx.get('SELECT * FROM orders WHERE id=?',[id]); if(!o)return null; const valid={requested:['invoiced','cancelled'],invoiced:['paid','cancelled'],paid:['activated','cancelled'],activated:[],cancelled:[]}; if(!valid[o.status]?.includes(status)){const e=new Error('Order status transition is invalid.'); e.code='INVALID_STATUS_TRANSITION'; throw e} await tx.run('UPDATE orders SET status=?, updated_at=? WHERE id=?',[status,now(),id]); if(status==='activated') await this.addMembership(o.user_id,o.membership_id,'order_activation',tx); return orderFrom(await tx.get('SELECT * FROM orders WHERE id=?',[id]))})}\n  async adminUpdateReservationStatus(id,status){return this.db.tx(async tx=>{const r=await tx.get('SELECT * FROM reservations WHERE id=?',[id]); if(!r)return null; const valid={requested:['confirmed','cancelled','completed'],confirmed:['completed','cancelled'],completed:[],cancelled:[]}; if(!valid[r.status]?.includes(status)){const e=new Error('Reservation status transition is invalid.'); e.code='INVALID_STATUS_TRANSITION'; throw e} await tx.run('UPDATE reservations SET status=?, updated_at=? WHERE id=?',[status,now(),id]); if(status==='completed') await this.incrementUsage(r.user_id,r.membership_id,r.template_id,tx); return reservationFrom(await tx.get('SELECT * FROM reservations WHERE id=?',[id]))})}\n  async adminUpdateAssistanceRequest(id,input={}){const row=await this.db.get('SELECT * FROM assistance_requests WHERE id=?',[id]); if(!row)return null; const status=input.status||row.status, adminNote=input.adminNote??row.admin_note??''; await this.db.run('UPDATE assistance_requests SET status=?, admin_note=?, updated_at=? WHERE id=?',[status,adminNote,now(),id]); return assistanceFrom(await this.db.get('SELECT * FROM assistance_requests WHERE id=?',[id]))}"
          if (!db.includes('async adminOrders()')) db = db.replace(oldAssistance, adminMethods)
          fs.writeFileSync('backend/db.js', db)

          let server = fs.readFileSync('backend/server.js', 'utf8')
          server = server.replace("function statusFor(code) { return { AUTH_REQUIRED:401, FORBIDDEN:403, MEMBERSHIP_NOT_FOUND:404, VOUCHER_NOT_FOUND:404, ORDER_NOT_FOUND:404, RESERVATION_NOT_FOUND:404, VOUCHER_NOT_AVAILABLE:409, VOUCHER_NOT_TRANSFERABLE:409, INVALID_STATUS_TRANSITION:409 }[code] || 500 }", "function statusFor(code) { return { AUTH_REQUIRED:401, ADMIN_REQUIRED:403, FORBIDDEN:403, MEMBERSHIP_NOT_FOUND:404, VOUCHER_NOT_FOUND:404, ORDER_NOT_FOUND:404, RESERVATION_NOT_FOUND:404, ASSISTANCE_REQUEST_NOT_FOUND:404, VOUCHER_NOT_AVAILABLE:409, VOUCHER_NOT_TRANSFERABLE:409, INVALID_STATUS_TRANSITION:409 }[code] || 500 }")
          const requireUser = "async function requireUser(req,res){const user=await currentUser(req); if(!user){error(res,401,'AUTH_REQUIRED','Sign in is required.'); return null} return user}"
          const requireAdmin = "function adminEmails(){return new Set(String(process.env.ADMIN_EMAILS||'').split(',').map(v=>v.trim().toLowerCase()).filter(Boolean))}\nasync function requireAdmin(req,res){const user=await requireUser(req,res); if(!user)return null; if(!adminEmails().has(String(user.email||'').toLowerCase())){error(res,403,'ADMIN_REQUIRED','Admin access is required.'); return null} return user}"
          if (!server.includes('function adminEmails')) server = server.replace(`${requireUser}\nfunction normalizePath`, `${requireUser}\n${requireAdmin}\nfunction normalizePath`)
          const adminBlock = "\n  if(path.startsWith('/admin/')){\n    const admin=await requireAdmin(req,res); if(!admin)return\n    if(req.method==='GET'&&path==='/admin/orders') return json(res,200,await store.adminOrders())\n    const adminOrderMatch=path.match(/^\\/admin\\/orders\\/([^/]+)\\/status$/)\n    if(req.method==='PATCH'&&adminOrderMatch){try{const order=await store.adminUpdateOrderStatus(adminOrderMatch[1],body.status); if(!order)return error(res,404,'ORDER_NOT_FOUND','Order was not found.'); return json(res,200,order)}catch(err){return error(res,statusFor(err.code),err.code||'INTERNAL_ERROR',err.message)}}\n    if(req.method==='GET'&&path==='/admin/reservations') return json(res,200,await store.adminReservations())\n    const adminReservationMatch=path.match(/^\\/admin\\/reservations\\/([^/]+)\\/status$/)\n    if(req.method==='PATCH'&&adminReservationMatch){try{const reservation=await store.adminUpdateReservationStatus(adminReservationMatch[1],body.status); if(!reservation)return error(res,404,'RESERVATION_NOT_FOUND','Reservation was not found.'); return json(res,200,reservation)}catch(err){return error(res,statusFor(err.code),err.code||'INTERNAL_ERROR',err.message)}}\n    if(req.method==='GET'&&path==='/admin/assistance-requests') return json(res,200,await store.adminAssistanceRequests())\n    const adminAssistanceMatch=path.match(/^\\/admin\\/assistance-requests\\/([^/]+)$/)\n    if(req.method==='PATCH'&&adminAssistanceMatch){const request=await store.adminUpdateAssistanceRequest(adminAssistanceMatch[1],body); if(!request)return error(res,404,'ASSISTANCE_REQUEST_NOT_FOUND','Assistance request was not found.'); return json(res,200,request)}\n    if(req.method==='GET'&&path==='/admin/settlements/summary') return json(res,200,await store.settlement())\n    return error(res,404,'NOT_FOUND','Endpoint was not found.')\n  }\n"
          if (!server.includes("path.startsWith('/admin/')")) server = server.replace("\n  if(req.method==='GET'&&(path==='/me/wallet'||path==='/wallet'))", `${adminBlock}\n  if(req.method==='GET'&&(path==='/me/wallet'||path==='/wallet'))`)
          fs.writeFileSync('backend/server.js', server)

          let api = fs.readFileSync('docs/BACKEND_API_SPEC.md', 'utf8')
          const adminSpec = "\n## 10. Admin\n\n관리자 API는 `Authorization: Bearer <accessToken>`이 필요하며, 백엔드는 `ADMIN_EMAILS` 환경변수에 포함된 이메일만 허용한다.\n\n### GET `/admin/orders`\n\n전체 주문 목록을 반환한다.\n\n### PATCH `/admin/orders/:orderId/status`\n\n주문 상태를 변경한다. `activated`가 되면 해당 사용자 지갑에 멤버십을 지급한다.\n\nRequest:\n\n```json\n{\n  \"status\": \"invoiced\"\n}\n```\n\n### GET `/admin/reservations`\n\n전체 예약 요청 목록을 반환한다.\n\n### PATCH `/admin/reservations/:reservationId/status`\n\n예약 상태를 변경한다. `completed`가 되면 해당 바우처 사용량을 증가시킨다.\n\nRequest:\n\n```json\n{\n  \"status\": \"confirmed\"\n}\n```\n\n### GET `/admin/assistance-requests`\n\n전체 도움 요청 목록을 반환한다.\n\n### PATCH `/admin/assistance-requests/:assistanceRequestId`\n\n도움 요청 처리 상태와 운영 메모를 저장한다.\n\nRequest:\n\n```json\n{\n  \"status\": \"handled\",\n  \"adminNote\": \"Contacted by operations.\"\n}\n```\n\n### GET `/admin/settlements/summary`\n\n전체 활성화 주문 기준 GMV, 수수료, 활성화 주문 수를 반환한다.\n"
          if (!api.includes('## 10. Admin')) api = api.replace('\n## 10. Quiz', `${adminSpec}\n## 11. Quiz`).replace('## 11. 주요 오류 코드', '## 12. 주요 오류 코드').replace('- `AUTH_REQUIRED`', '- `AUTH_REQUIRED`\n- `ADMIN_REQUIRED`').replace('- `ORDER_NOT_ACTIVATABLE`', '- `ORDER_NOT_ACTIVATABLE`\n- `ASSISTANCE_REQUEST_NOT_FOUND`')
          fs.writeFileSync('docs/BACKEND_API_SPEC.md', api)

          let proto = fs.readFileSync('docs/BACKEND_PROTOTYPE.md', 'utf8')
          const adminList = "- `POST /api/v1/recommendations/quiz`\n- `GET /api/v1/admin/orders`\n- `PATCH /api/v1/admin/orders/:id/status`\n- `GET /api/v1/admin/reservations`\n- `PATCH /api/v1/admin/reservations/:id/status`\n- `GET /api/v1/admin/assistance-requests`\n- `PATCH /api/v1/admin/assistance-requests/:id`\n- `GET /api/v1/admin/settlements/summary`\n\n## 관리자 모드\n\n관리자 API는 `ADMIN_EMAILS` 환경변수에 등록된 이메일만 접근할 수 있다.\n\n```bash\nADMIN_EMAILS=demo.user@gmail.com npm run backend\n```\n\n여러 명은 쉼표로 구분한다.\n\n```bash\nADMIN_EMAILS=owner@example.com,ops@example.com npm run backend\n```"
          if (!proto.includes('## 관리자 모드')) proto = proto.replace('- `POST /api/v1/recommendations/quiz`', adminList)
          fs.writeFileSync('docs/BACKEND_PROTOTYPE.md', proto)

          let config = fs.readFileSync('playwright.api.config.js', 'utf8')
          config = config.replace("env: { SQLITE_PATH: sqlitePath },", "env: { SQLITE_PATH: sqlitePath, ADMIN_EMAILS: 'demo.user@gmail.com' },")
          fs.writeFileSync('playwright.api.config.js', config)

          let spec = fs.readFileSync('e2e-api/api-flow.spec.js', 'utf8')
          if (!spec.includes('Admin API: guard')) spec += `\n\ntest('Admin API: guard + manage orders, reservations, assistance, settlements', async ({ request }) => {\n  const api = 'http://localhost:8787/api/v1'\n  const signIn = async (credential) => {\n    const res = await request.post(\`${'${api}'}/auth/google\`, { data: { credential } })\n    expect(res.ok()).toBeTruthy()\n    return res.json()\n  }\n  const auth = (token) => ({ Authorization: \`Bearer ${'${token}'}\` })\n\n  const member = await signIn('frontdesk-user')\n  const admin = await signIn('demo-google-user')\n\n  const forbidden = await request.get(\`${'${api}'}/admin/orders\`, { headers: auth(member.accessToken) })\n  expect(forbidden.status()).toBe(403)\n  expect((await forbidden.json()).code).toBe('ADMIN_REQUIRED')\n\n  const orderRes = await request.post(\`${'${api}'}/orders\`, {\n    headers: auth(member.accessToken),\n    data: { membershipId: 'club-marriott-vietnam', buyerName: 'Front Desk', buyerEmail: 'frontdesk@example.com', city: 'ho-chi-minh' },\n  })\n  expect(orderRes.status()).toBe(201)\n  const order = await orderRes.json()\n\n  const orderListRes = await request.get(\`${'${api}'}/admin/orders\`, { headers: auth(admin.accessToken) })\n  expect(orderListRes.ok()).toBeTruthy()\n  expect((await orderListRes.json()).some((item) => item.id === order.id)).toBeTruthy()\n\n  for (const status of ['invoiced', 'paid', 'activated']) {\n    const res = await request.patch(\`${'${api}'}/admin/orders/${'${order.id}'}/status\`, { headers: auth(admin.accessToken), data: { status } })\n    expect(res.ok()).toBeTruthy()\n    expect((await res.json()).status).toBe(status)\n  }\n\n  const walletRes = await request.get(\`${'${api}'}/wallet\`, { headers: auth(member.accessToken) })\n  expect(walletRes.ok()).toBeTruthy()\n  expect((await walletRes.json()).memberships.some((item) => item.id === 'club-marriott-vietnam')).toBeTruthy()\n\n  const reservationRes = await request.post(\`${'${api}'}/reservations\`, {\n    headers: auth(member.accessToken),\n    data: { membershipId: 'club-marriott-vietnam', templateId: 'cm-dinner', date: '2026-09-12', adults: 2, children: 0, childAges: [], hotel: 'Sheraton Saigon Grand Opera Hotel' },\n  })\n  expect(reservationRes.status()).toBe(201)\n  const reservation = await reservationRes.json()\n\n  const reservationsRes = await request.get(\`${'${api}'}/admin/reservations\`, { headers: auth(admin.accessToken) })\n  expect(reservationsRes.ok()).toBeTruthy()\n  expect((await reservationsRes.json()).some((item) => item.id === reservation.id)).toBeTruthy()\n\n  for (const status of ['confirmed', 'completed']) {\n    const res = await request.patch(\`${'${api}'}/admin/reservations/${'${reservation.id}'}/status\`, { headers: auth(admin.accessToken), data: { status } })\n    expect(res.ok()).toBeTruthy()\n    expect((await res.json()).status).toBe(status)\n  }\n\n  const assistanceRes = await request.post(\`${'${api}'}/assistance-requests\`, {\n    headers: auth(member.accessToken),\n    data: { name: 'Front Desk', contact: 'frontdesk@example.com', city: 'ho-chi-minh', requestType: 'booking', message: 'Need admin follow-up.' },\n  })\n  expect(assistanceRes.status()).toBe(201)\n  const assistance = await assistanceRes.json()\n\n  const assistanceListRes = await request.get(\`${'${api}'}/admin/assistance-requests\`, { headers: auth(admin.accessToken) })\n  expect(assistanceListRes.ok()).toBeTruthy()\n  expect((await assistanceListRes.json()).some((item) => item.id === assistance.id)).toBeTruthy()\n\n  const handledRes = await request.patch(\`${'${api}'}/admin/assistance-requests/${'${assistance.id}'}\`, {\n    headers: auth(admin.accessToken),\n    data: { status: 'handled', adminNote: 'Contacted by operations.' },\n  })\n  expect(handledRes.ok()).toBeTruthy()\n  const handled = await handledRes.json()\n  expect(handled.status).toBe('handled')\n  expect(handled.adminNote).toBe('Contacted by operations.')\n\n  const settlementRes = await request.get(\`${'${api}'}/admin/settlements/summary\`, { headers: auth(admin.accessToken) })\n  expect(settlementRes.ok()).toBeTruthy()\n  const settlement = await settlementRes.json()\n  expect(settlement.activatedOrderCount).toBeGreaterThanOrEqual(1)\n  expect(settlement.gmv).toBeGreaterThan(0)\n})\n`
          fs.writeFileSync('e2e-api/api-flow.spec.js', spec)
          NODE
      - name: Verify syntax and direct admin API
        run: |
          npm install
          node --check backend/server.js
          node --check backend/db.js
          node --check e2e-api/api-flow.spec.js
          PORT=8877 SQLITE_PATH=backend/.data/admin-direct.sqlite ADMIN_EMAILS=demo.user@gmail.com node backend/server.js > /tmp/admin-server.log 2>&1 &
          pid=$!
          trap 'kill $pid || true' EXIT
          for i in {1..40}; do curl -fsS http://localhost:8877/api/v1/health && break || sleep 0.5; done
          node <<'NODE'
          const assert = require('node:assert/strict')
          const api = 'http://localhost:8877/api/v1'
          async function signIn(credential){ const r=await fetch(`${api}/auth/google`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({credential})}); assert.equal(r.status,200); return r.json() }
          const auth = token => ({Authorization:`Bearer ${token}`,'Content-Type':'application/json'})
          const member = await signIn('frontdesk-user')
          const admin = await signIn('demo-google-user')
          let r = await fetch(`${api}/admin/orders`,{headers:auth(member.accessToken)}); assert.equal(r.status,403)
          r = await fetch(`${api}/orders`,{method:'POST',headers:auth(member.accessToken),body:JSON.stringify({membershipId:'club-marriott-vietnam',buyerName:'Front Desk',buyerEmail:'frontdesk@example.com',city:'ho-chi-minh'})}); assert.equal(r.status,201); const order=await r.json()
          for (const status of ['invoiced','paid','activated']) { r=await fetch(`${api}/admin/orders/${order.id}/status`,{method:'PATCH',headers:auth(admin.accessToken),body:JSON.stringify({status})}); assert.equal(r.status,200) }
          r = await fetch(`${api}/reservations`,{method:'POST',headers:auth(member.accessToken),body:JSON.stringify({membershipId:'club-marriott-vietnam',templateId:'cm-dinner',date:'2026-09-12',adults:2,children:0,childAges:[],hotel:'Sheraton Saigon Grand Opera Hotel'})}); assert.equal(r.status,201); const reservation=await r.json()
          for (const status of ['confirmed','completed']) { r=await fetch(`${api}/admin/reservations/${reservation.id}/status`,{method:'PATCH',headers:auth(admin.accessToken),body:JSON.stringify({status})}); assert.equal(r.status,200) }
          r = await fetch(`${api}/assistance-requests`,{method:'POST',headers:auth(member.accessToken),body:JSON.stringify({name:'Front Desk',contact:'frontdesk@example.com',city:'ho-chi-minh',requestType:'booking',message:'Need admin follow-up.'})}); assert.equal(r.status,201); const assistance=await r.json()
          r = await fetch(`${api}/admin/assistance-requests/${assistance.id}`,{method:'PATCH',headers:auth(admin.accessToken),body:JSON.stringify({status:'handled',adminNote:'Contacted by operations.'})}); assert.equal(r.status,200); assert.equal((await r.json()).adminNote,'Contacted by operations.')
          r = await fetch(`${api}/admin/settlements/summary`,{headers:auth(admin.accessToken)}); assert.equal(r.status,200); assert.ok((await r.json()).gmv>0)
          console.log('direct admin api passed')
          NODE
      - name: Commit admin MVP
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/db.js backend/server.js docs/BACKEND_API_SPEC.md docs/BACKEND_PROTOTYPE.md e2e-api/api-flow.spec.js playwright.api.config.js
          if git diff --cached --quiet; then
            echo "No admin MVP changes to commit."
          else
            git commit -m "Add admin MVP backend APIs"
            git push
          fi
