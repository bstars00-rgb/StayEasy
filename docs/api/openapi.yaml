openapi: 3.1.0
info:
  title: StayEasy API
  version: 0.1.0
  description: >
    Contract for the StayEasy backend. The frontend (this repo) currently runs
    on localStorage; src/api/ mirrors these endpoints and will become the live
    data source when VITE_USE_API=true. Keep this file and src/api/stayeasyApi.js
    in sync. Auth uses a Bearer session token issued from a Google ID token.
servers:
  - url: http://localhost:8787
    description: Local backend (dev)
  - url: https://api.stayeasy.app
    description: Production (placeholder)

security:
  - bearerAuth: []

tags:
  - name: auth
  - name: catalog
  - name: wallet
  - name: reservations
  - name: transfers
  - name: orders
  - name: partner
  - name: assistance

paths:
  /auth/google:
    post:
      tags: [auth]
      security: []
      summary: Exchange a Google ID token for a session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [credential]
              properties:
                credential: { type: string, description: Google ID token (JWT) }
      responses:
        '200':
          description: Session issued
          content:
            application/json:
              schema:
                type: object
                properties:
                  token: { type: string }
                  user: { $ref: '#/components/schemas/User' }
        '401': { $ref: '#/components/responses/Error' }

  /auth/me:
    get:
      tags: [auth]
      summary: Current user
      responses:
        '200':
          description: OK
          content: { application/json: { schema: { $ref: '#/components/schemas/User' } } }
        '401': { $ref: '#/components/responses/Error' }

  /auth/logout:
    post:
      tags: [auth]
      summary: Invalidate the session
      responses: { '204': { description: No content } }

  /memberships:
    get:
      tags: [catalog]
      security: []
      summary: List memberships (catalog)
      parameters:
        - { in: query, name: city, schema: { type: string }, description: city id }
        - { in: query, name: benefit, schema: { type: string }, description: benefit tag }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Membership' } }

  /memberships/{id}:
    get:
      tags: [catalog]
      security: []
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Membership' } } } }
        '404': { $ref: '#/components/responses/Error' }

  /memberships/{id}/vouchers:
    get:
      tags: [catalog]
      security: []
      summary: Voucher pack (templates) for a membership
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/VoucherTemplate' } }

  /me/wallet:
    get:
      tags: [wallet]
      summary: Owned memberships + vouchers with computed availability
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  memberships: { type: array, items: { type: string }, description: membership ids }
                  vouchers:
                    type: array
                    items:
                      allOf:
                        - $ref: '#/components/schemas/VoucherTemplate'
                        - type: object
                          properties:
                            membershipId: { type: string }
                            stats: { $ref: '#/components/schemas/VoucherStats' }

  /me/memberships:
    post:
      tags: [wallet]
      summary: Add a membership to the wallet (free join / after order activation)
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [membershipId], properties: { membershipId: { type: string } } }
      responses: { '201': { description: Added }, '401': { $ref: '#/components/responses/Error' } }

  /me/memberships/{id}:
    delete:
      tags: [wallet]
      summary: Remove a membership (also purges its usage + reservations + transfers)
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses: { '204': { description: Removed } }

  /me/reservations:
    get:
      tags: [reservations]
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Reservation' } } } } }
    post:
      tags: [reservations]
      summary: Create a booking request
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ReservationCreate' } } }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/Reservation' } } } }
        '409': { $ref: '#/components/responses/Error', description: No availability }

  /me/reservations/{id}:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    patch:
      tags: [reservations]
      summary: Update status (completing consumes one voucher)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties: { status: { $ref: '#/components/schemas/ReservationStatus' } }
      responses: { '200': { description: Updated, content: { application/json: { schema: { $ref: '#/components/schemas/Reservation' } } } } }
    delete:
      tags: [reservations]
      responses: { '204': { description: Deleted } }

  /me/transfers:
    get:
      tags: [transfers]
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Transfer' } } } } }
    post:
      tags: [transfers]
      summary: Gift (transfer) one voucher (consumes one unit)
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/TransferCreate' } } }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/Transfer' } } } }
        '409': { $ref: '#/components/responses/Error', description: Not transferable / no availability }

  /me/orders:
    get:
      tags: [orders]
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Order' } } } } }
    post:
      tags: [orders]
      summary: Create a purchase order (payment is settled at the hotel brand)
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/OrderCreate' } } }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/Order' } } } }

  /me/orders/{id}:
    patch:
      tags: [orders]
      summary: Advance order status (activated grants the membership)
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties: { status: { $ref: '#/components/schemas/OrderStatus' } }
      responses: { '200': { description: Updated, content: { application/json: { schema: { $ref: '#/components/schemas/Order' } } } } }

  /partner/settlement:
    get:
      tags: [partner]
      summary: Sales + commission aggregates (partner/ops scope)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  byCurrency:
                    type: array
                    items:
                      type: object
                      properties:
                        currency: { type: string }
                        gmv: { type: number }
                        commission: { type: number }
                  statusCounts:
                    type: object
                    additionalProperties: { type: integer }
                  byMembership:
                    type: array
                    items:
                      type: object
                      properties:
                        membershipId: { type: string }
                        orders: { type: integer }
                        commission: { type: number }
                        currency: { type: string }

  /assistance:
    post:
      tags: [assistance]
      security: []
      summary: Submit an assistance request (server may forward to WhatsApp/email)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                email: { type: string }
                phone: { type: string }
                city: { type: string }
                membership: { type: string }
                date: { type: string }
                guests: { type: integer }
                type: { type: string }
                message: { type: string }
      responses: { '202': { description: Accepted } }

components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }
  parameters:
    Id: { in: path, name: id, required: true, schema: { type: string } }
  responses:
    Error:
      description: Error
      content:
        application/json:
          schema:
            type: object
            properties:
              error: { type: string }
              message: { type: string }
  schemas:
    User:
      type: object
      properties:
        id: { type: string }
        provider: { type: string, enum: [google] }
        name: { type: string }
        email: { type: string }
        picture: { type: string }
    Money: { type: number, description: Integer minor-unit-free amount in the given currency }
    Membership:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        brand: { type: string }
        country: { type: string }
        cities: { type: array, items: { type: string } }
        hotels: { type: array, items: { type: string } }
        annualFee: { $ref: '#/components/schemas/Money' }
        currency: { type: string }
        salePrice: { type: [number, 'null'] }
        commissionRate: { type: number }
        diningDiscount: { type: [integer, 'null'] }
        roomDiscount: { type: [integer, 'null'] }
        freeNight: { type: boolean }
        spaBenefit: { type: boolean }
        bestFor: { type: array, items: { type: string } }
        estimatedSavings: { $ref: '#/components/schemas/Money' }
        notes: { type: string }
        officialUrl: { type: string }
        scores:
          type: object
          properties:
            familyDining: { type: integer }
            staycation: { type: integer }
            businessTravel: { type: integer }
            easeOfUse: { type: integer }
            overall: { type: integer }
    VoucherCategory:
      type: string
      enum: [dining, room, spa, discount, gift, other]
    VoucherTemplate:
      type: object
      properties:
        templateId: { type: string }
        category: { $ref: '#/components/schemas/VoucherCategory' }
        title: { type: string }
        description: { type: string }
        quantity: { type: integer }
        validUntil: { type: string, format: date }
        hotels: { type: array, items: { type: string } }
        city: { type: string }
        transferable: { type: boolean }
        note: { type: string }
    VoucherStats:
      type: object
      description: available = quantity - used - held - transferred
      properties:
        quantity: { type: integer }
        used: { type: integer }
        held: { type: integer }
        transferred: { type: integer }
        available: { type: integer }
    ReservationStatus: { type: string, enum: [requested, confirmed, completed, cancelled] }
    ReservationCreate:
      type: object
      required: [membershipId, templateId]
      properties:
        membershipId: { type: string }
        templateId: { type: string }
        date: { type: string, format: date }
        adults: { type: integer }
        children: { type: integer }
        childAges: { type: array, items: { type: integer } }
        hotel: { type: string }
        note: { type: string }
    Reservation:
      allOf:
        - $ref: '#/components/schemas/ReservationCreate'
        - type: object
          properties:
            id: { type: string }
            title: { type: string }
            status: { $ref: '#/components/schemas/ReservationStatus' }
            createdAt: { type: string, format: date-time }
    TransferCreate:
      type: object
      required: [membershipId, templateId, recipientName]
      properties:
        membershipId: { type: string }
        templateId: { type: string }
        recipientName: { type: string }
        recipientContact: { type: string }
        message: { type: string }
    Transfer:
      allOf:
        - $ref: '#/components/schemas/TransferCreate'
        - type: object
          properties:
            id: { type: string }
            title: { type: string }
            createdAt: { type: string, format: date-time }
    OrderStatus: { type: string, enum: [requested, invoiced, paid, activated, cancelled] }
    OrderCreate:
      type: object
      required: [membershipId]
      properties:
        membershipId: { type: string }
        buyerName: { type: string }
        buyerEmail: { type: string }
        buyerPhone: { type: string }
        city: { type: string }
    Order:
      type: object
      properties:
        id: { type: string }
        membershipId: { type: string }
        buyerName: { type: string }
        buyerEmail: { type: string }
        buyerPhone: { type: string }
        city: { type: string }
        listPrice: { $ref: '#/components/schemas/Money' }
        salePrice: { type: [number, 'null'] }
        paidAmount: { $ref: '#/components/schemas/Money' }
        currency: { type: string }
        commissionRate: { type: number }
        commissionAmount: { $ref: '#/components/schemas/Money' }
        status: { $ref: '#/components/schemas/OrderStatus' }
        createdAt: { type: string, format: date-time }
